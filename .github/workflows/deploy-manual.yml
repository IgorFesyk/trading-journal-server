name: Manual Deploy

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Docker image tag to deploy (e.g. 1.1.2)'
                required: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Deploy to EC2
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.EC2_HOST }}
                  username: ${{ secrets.EC2_SSH_USER }}
                  key: ${{ secrets.EC2_SSH_KEY }}
                  script: |
                      cd /home/ec2-user
                      docker pull igorfesyk/trading-journal-server:${{ github.event.inputs.version }}
                      docker run --rm --env-file .env igorfesyk/trading-journal-server:${{ github.event.inputs.version }} npx prisma migrate deploy
                      docker stop trading-journal-server || true
                      docker rm trading-journal-server || true
                      docker run -d --restart unless-stopped --name trading-journal-server -p 5000:5000 --env-file .env igorfesyk/trading-journal-server:${{ github.event.inputs.version }}
