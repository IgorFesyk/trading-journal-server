name: CI/CD

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    ci:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Code style
              run: npm run code-style

            - name: Unit tests
              run: npm test

    version-bump:
        needs: ci
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        outputs:
            version: ${{ steps.decide.outputs.version }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Decide whether to auto-bump
              id: decide
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

                  CURRENT_VERSION=$(node -p "require('./package.json').version")
                  PREVIOUS_VERSION=$(git show ${{ github.event.before }}:package.json 2>/dev/null | jq -r '.version' 2>/dev/null || echo "")

                  if [ "$CURRENT_VERSION" = "$PREVIOUS_VERSION" ] || [ -z "$PREVIOUS_VERSION" ]; then
                      npm version patch --no-git-tag-version
                      NEW_VERSION=$(node -p "require('./package.json').version")
                      git add package.json
                      git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
                      git push origin HEAD:master
                      echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
                  else
                      echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
                  fi

    build-and-push:
        needs: version-bump
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: master

            - uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: linux/amd64
                  push: true
                  tags: |
                      igorfesyk/trading-journal-server:${{ needs.version-bump.outputs.version }}
                      igorfesyk/trading-journal-server:latest

    deploy:
        needs: [build-and-push, version-bump]
        runs-on: ubuntu-latest
        steps:
            - name: Deploy to EC2
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.EC2_HOST }}
                  username: ${{ secrets.EC2_SSH_USER }}
                  key: ${{ secrets.EC2_SSH_KEY }}
                  script: |
                      cd /home/ec2-user
                      docker pull igorfesyk/trading-journal-server:${{ needs.version-bump.outputs.version }}
                      docker run --rm --env-file .env igorfesyk/trading-journal-server:${{ needs.version-bump.outputs.version }} npx prisma migrate deploy
                      docker stop trading-journal-server || true
                      docker rm trading-journal-server || true
                      docker run -d --restart unless-stopped --name trading-journal-server -p 5000:5000 --env-file .env igorfesyk/trading-journal-server:${{ needs.version-bump.outputs.version }}
