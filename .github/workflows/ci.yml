name: CI/CD

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    ci:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Code style
              run: npm run code-style

            - name: Unit tests
              run: npm test

    build-and-push:
        needs: ci
        if: github.event.name == 'push'
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - uses: actions/checkout@v4

            - name: Read version from package.json
              id: version
              run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

            - uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: linux/amd64
                  push: true
                  tags: |
                      igorfesyk/trading-journal-server:${{ steps.version.outputs.version }}
                      igorfesyk/trading-journal-server:latest

    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest
        steps:
            - name: Deploy to EC2
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.EC2_HOST }}
                  username: ${{ secrets.EC2_SSH_USER }}
                  key: ${{ secrets.EC2_SSH_KEY }}
                  script: |
                      cd /home/ec2-user
                      docker pull igorfesyk/trading-journal-server:${{ needs.build-and-push.outputs.version }}
                      docker run --rm --env-file .env igorfesyk/trading-journal-server:${{ needs.build-and-push.outputs.version }} npx prisma migrate deploy
                      docker stop trading-journal-server || true
                      docker rm trading-journal-server || true
                      docker run -d --restart unless-stopped --name trading-journal-server -p 5000:5000 --env-file .env igorfesyk/trading-journal-server:${{ needs.build-and-push.outputs.version }}
